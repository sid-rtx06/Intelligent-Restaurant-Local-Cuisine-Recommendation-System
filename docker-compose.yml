version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rtrp_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant_recommendation
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: rtrp_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtrp_backend
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DB=restaurant_recommendation
      - MYSQL_PORT=3306
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=restaurant_reviews
    depends_on:
      - mysql
      - mongodb
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
