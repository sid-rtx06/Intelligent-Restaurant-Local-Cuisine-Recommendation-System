<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Smart Cuisine Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="p-6">
            <h2 class="text-2xl font-bold text-white"><i class="fas fa-utensils text-red-500 mr-2"></i>RTRP Admin</h2>
        </div>
        <nav class="mt-6">
            <a href="index.html" class="nav-link"><i class="fas fa-tachometer-alt mr-3"></i>Dashboard</a>
            <a href="restaurants.html" class="nav-link"><i class="fas fa-store mr-3"></i>Restaurants</a>
            <a href="reviews.html" class="nav-link"><i class="fas fa-comments mr-3"></i>Reviews</a>
            <a href="users.html" class="nav-link active"><i class="fas fa-users mr-3"></i>Users</a>
            <a href="analytics.html" class="nav-link"><i class="fas fa-chart-bar mr-3"></i>Analytics</a>
            <a href="settings.html" class="nav-link"><i class="fas fa-cog mr-3"></i>Settings</a>
            <a href="../index.html" class="nav-link mt-8 text-red-400 hover:text-red-300"><i class="fas fa-sign-out-alt mr-3"></i>Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="hidden text-gray-500 mr-4 focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-semibold">User Management</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="dark-mode-toggle" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-moon text-xl"></i>
                </button>
                <div class="flex items-center">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=ef4444&color=fff" alt="Profile" class="w-8 h-8 rounded-full">
                </div>
            </div>
        </div>

        <div class="admin-card">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0">
                <div class="flex space-x-4 w-full md:w-auto">
                    <input type="text" id="search-input" placeholder="Search user by name or email..." class="border border-gray-300 dark:border-gray-700 rounded-md px-4 py-2 w-full md:w-80 focus:outline-none focus:ring-2 focus:ring-red-500 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
                </div>
            </div>

            <div class="table-wrapper">
                <table class="admin-table text-sm">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Registration Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <!-- Users rendered dynamically -->
                    </tbody>
                </table>
            </div>
            
            <div class="flex justify-between items-center mt-6">
                <span id="showing-count" class="text-sm text-gray-500">Showing 1 to 3 of 6 entries</span>
                <div class="flex space-x-1" id="pagination-controls">
                    <!-- Pagination rendered dynamically -->
                </div>
            </div>
        </div>
    </div>
    <script src="js/admin.js"></script>
    <script>
        const baseUsers = [
            { name: "Rahul Sharma", email: "rahul@example.com", date: "Oct 12, 2023", status: "Active" },
            { name: "BotUser99", email: "bot99@spam.com", date: "Nov 05, 2023", status: "Blocked" },
            { name: "Priya Patel", email: "priya@example.com", date: "Jan 20, 2024", status: "Active" },
            { name: "Amit Kumar", email: "amit@example.com", date: "Feb 18, 2024", status: "Active" },
            { name: "Srujana Reddy", email: "srujana@example.com", date: "Mar 22, 2024", status: "Active" },
            { name: "Sneha Kapoor", email: "sneha@example.com", date: "Apr 05, 2024", status: "Blocked" }
        ];

        const users = [];
        for (let i = 0; i < 12456; i++) {
            const base = baseUsers[i % baseUsers.length];
            users.push({
                id: i + 1,
                name: `${base.name} ${Math.floor(i / baseUsers.length) || ''}`.trim(),
                email: `${base.email.split('@')[0]}${i}@${base.email.split('@')[1]}`,
                date: base.date,
                status: base.status
            });
        }

        let currentPage = 1;
        const itemsPerPage = 3;
        let filteredUsers = [...users];

        function renderUsers() {
            const tbody = document.getElementById('users-tbody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageUsers = filteredUsers.slice(startIndex, endIndex);

            tbody.innerHTML = pageUsers.map(u => {
                const isActive = u.status === 'Active';
                const badgeClass = isActive ? 'badge-success' : 'badge-danger';
                const actionBtn = isActive 
                    ? `<button onclick="toggleUserStatus(${u.id})" class="text-yellow-500 hover:text-yellow-700 mr-2" title="Block User"><i class="fas fa-ban"></i></button>`
                    : `<button onclick="toggleUserStatus(${u.id})" class="text-green-500 hover:text-green-700 mr-2" title="Unblock User"><i class="fas fa-unlock"></i></button>`;
                
                return `
                    <tr>
                        <td class="font-medium flex items-center">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=random" class="w-8 h-8 rounded-full mr-3 ${isActive ? '' : 'grayscale'}">
                            ${u.name}
                        </td>
                        <td>${u.email}</td>
                        <td>${u.date}</td>
                        <td><span class="badge ${badgeClass}">${u.status}</span></td>
                        <td>
                            ${actionBtn}
                            <button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700" title="Delete User"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredUsers.length / itemsPerPage) || 1;
            const controls = document.getElementById('pagination-controls');
            const countSpan = document.getElementById('showing-count');
            
            const startEntry = filteredUsers.length === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
            const endEntry = Math.min(currentPage * itemsPerPage, filteredUsers.length);
            countSpan.textContent = `Showing ${startEntry.toLocaleString()} to ${endEntry.toLocaleString()} of ${filteredUsers.length.toLocaleString()} entries`;

            let paginationHtml = '';
            
            // Prev Button
            const prevDisabled = currentPage === 1 ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : '';
            paginationHtml += `<button onclick="changePage(${currentPage - 1})" ${prevDisabled} class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">Prev</button>`;

            // Page Numbers (Truncated)
            const maxPageButtons = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxPageButtons - 1);

            if (endPage - startPage < maxPageButtons - 1) {
                startPage = Math.max(1, endPage - maxPageButtons + 1);
            }

            if (startPage > 1) {
                paginationHtml += `<button onclick="changePage(1)" class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">1</button>`;
                if (startPage > 2) {
                    paginationHtml += `<span class="px-2 py-1 text-gray-500">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === currentPage ? 'bg-red-500 text-white border-red-500' : 'hover:bg-gray-100 dark:hover:bg-gray-800';
                paginationHtml += `<button onclick="changePage(${i})" class="px-3 py-1 border rounded-md ${activeClass} transition">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHtml += `<span class="px-2 py-1 text-gray-500">...</span>`;
                }
                paginationHtml += `<button onclick="changePage(${totalPages})" class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">${totalPages}</button>`;
            }

            // Next Button
            const nextDisabled = currentPage === totalPages ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : '';
            paginationHtml += `<button onclick="changePage(${currentPage + 1})" ${nextDisabled} class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">Next</button>`;

            controls.innerHTML = paginationHtml;
        }

        function changePage(page) {
            currentPage = page;
            renderUsers();
        }

        function toggleUserStatus(id) {
            const user = users.find(u => u.id === id);
            if (user) {
                user.status = user.status === 'Active' ? 'Blocked' : 'Active';
                renderUsers();
            }
        }

        function deleteUser(id) {
            if (!confirm("Are you sure you want to delete this user?")) return;
            const index = users.findIndex(u => u.id === id);
            if (index !== -1) {
                users.splice(index, 1);
                filterUsers();
            }
        }

        function filterUsers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            filteredUsers = users.filter(u => 
                u.name.toLowerCase().includes(query) || 
                u.email.toLowerCase().includes(query)
            );
            currentPage = 1;
            renderUsers();
        }

        document.getElementById('search-input').addEventListener('input', filterUsers);

        // Initial render
        renderUsers();
    </script>
</body>
</html>
