<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Management - Smart Cuisine Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="p-6">
            <h2 class="text-2xl font-bold text-white"><i class="fas fa-utensils text-red-500 mr-2"></i>RTRP Admin</h2>
        </div>
        <nav class="mt-6">
            <a href="index.html" class="nav-link"><i class="fas fa-tachometer-alt mr-3"></i>Dashboard</a>
            <a href="restaurants.html" class="nav-link active"><i class="fas fa-store mr-3"></i>Restaurants</a>
            <a href="reviews.html" class="nav-link"><i class="fas fa-comments mr-3"></i>Reviews</a>
            <a href="users.html" class="nav-link"><i class="fas fa-users mr-3"></i>Users</a>
            <a href="analytics.html" class="nav-link"><i class="fas fa-chart-bar mr-3"></i>Analytics</a>
            <a href="settings.html" class="nav-link"><i class="fas fa-cog mr-3"></i>Settings</a>
            <a href="../index.html" class="nav-link mt-8 text-red-400 hover:text-red-300"><i class="fas fa-sign-out-alt mr-3"></i>Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="hidden text-gray-500 mr-4 focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-semibold">Restaurant Management</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="dark-mode-toggle" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-moon text-xl"></i>
                </button>
                <div class="flex items-center">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=ef4444&color=fff" alt="Profile" class="w-8 h-8 rounded-full">
                </div>
            </div>
        </div>

        <div class="admin-card">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0">
                <div class="flex space-x-4 w-full md:w-auto">
                    <input type="text" id="search-input" placeholder="Search restaurant..." class="border border-gray-300 dark:border-gray-700 rounded-md px-4 py-2 w-full md:w-64 focus:outline-none focus:ring-2 focus:ring-red-500 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
                    <select id="cuisine-filter" class="border border-gray-300 dark:border-gray-700 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-red-500 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
                        <option value="">All Cuisines</option>
                        <option value="hyderabadi">Hyderabadi</option>
                        <option value="north-indian">North Indian</option>
                        <option value="chinese">Chinese</option>
                        <option value="mughlai">Mughlai</option>
                        <option value="continental">Continental</option>
                        <option value="south indian">South Indian</option>
                    </select>
                </div>
                <button onclick="alert('Add restaurant feature clicked!')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md font-medium w-full md:w-auto">
                    <i class="fas fa-plus mr-2"></i>Add Restaurant
                </button>
            </div>

            <div class="table-wrapper">
                <table class="admin-table text-sm">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Cuisine Type</th>
                            <th>Rating</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="restaurants-tbody">
                        <!-- Restaurants rendered dynamically -->
                    </tbody>
                </table>
            </div>
            
            <div class="flex justify-between items-center mt-6">
                <span id="showing-count" class="text-sm text-gray-500">Showing 1 to 3 of 6 entries</span>
                <div class="flex space-x-1" id="pagination-controls">
                    <!-- Pagination rendered dynamically -->
                </div>
            </div>
        </div>
    </div>
    <script src="js/admin.js"></script>
    <script>
        const baseRestaurants = [
            { name: "Paradise Biryani", location: "Secunderabad", cuisine: "Hyderabadi", rating: 4.5, status: "Active" },
            { name: "Hotel Bawarchi", location: "RTC X Roads", cuisine: "Hyderabadi", rating: 4.8, status: "Active" },
            { name: "Capital Multi Cuisine", location: "Madhapur", cuisine: "Mughlai", rating: 4.2, status: "Inactive" },
            { name: "Cafe Niloufer", location: "Red Hills", cuisine: "Continental", rating: 4.7, status: "Active" },
            { name: "Chutneys", location: "Himayatnagar", cuisine: "South Indian", rating: 4.4, status: "Active" },
            { name: "Mehfil", location: "Narayanguda", cuisine: "Mughlai", rating: 4.3, status: "Active" }
        ];

        const restaurants = [];
        for (let i = 0; i < 150; i++) {
            const base = baseRestaurants[i % baseRestaurants.length];
            restaurants.push({
                id: i + 1,
                name: `${base.name} ${Math.floor(i / baseRestaurants.length) || ''}`.trim(),
                location: base.location,
                cuisine: base.cuisine,
                rating: base.rating,
                status: base.status
            });
        }

        let currentPage = 1;
        const itemsPerPage = 3;
        let filteredRestaurants = [...restaurants];

        function renderRestaurants() {
            const tbody = document.getElementById('restaurants-tbody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredRestaurants.slice(startIndex, endIndex);

            tbody.innerHTML = pageItems.map(r => {
                const isActive = r.status === 'Active';
                const badgeClass = isActive ? 'badge-success' : 'badge-warning';
                
                return `
                    <tr>
                        <td class="font-medium">${r.name}</td>
                        <td>${r.location}</td>
                        <td>${r.cuisine}</td>
                        <td><i class="fas fa-star text-yellow-400"></i> ${r.rating.toFixed(1)}</td>
                        <td><span class="badge ${badgeClass}">${r.status}</span></td>
                        <td>
                            <button onclick="editRestaurant(${r.id})" class="text-blue-500 hover:text-blue-700 mr-2" title="Edit"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteRestaurant(${r.id})" class="text-red-500 hover:text-red-700" title="Delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredRestaurants.length / itemsPerPage) || 1;
            const controls = document.getElementById('pagination-controls');
            const countSpan = document.getElementById('showing-count');
            
            const startEntry = filteredRestaurants.length === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
            const endEntry = Math.min(currentPage * itemsPerPage, filteredRestaurants.length);
            countSpan.textContent = `Showing ${startEntry.toLocaleString()} to ${endEntry.toLocaleString()} of ${filteredRestaurants.length.toLocaleString()} entries`;

            let paginationHtml = '';
            
            // Prev Button
            const prevDisabled = currentPage === 1 ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : '';
            paginationHtml += `<button onclick="changePage(${currentPage - 1})" ${prevDisabled} class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">Prev</button>`;

            // Page Numbers (Truncated)
            const maxPageButtons = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxPageButtons - 1);

            if (endPage - startPage < maxPageButtons - 1) {
                startPage = Math.max(1, endPage - maxPageButtons + 1);
            }

            if (startPage > 1) {
                paginationHtml += `<button onclick="changePage(1)" class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">1</button>`;
                if (startPage > 2) {
                    paginationHtml += `<span class="px-2 py-1 text-gray-500">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === currentPage ? 'bg-red-500 text-white border-red-500' : 'hover:bg-gray-100 dark:hover:bg-gray-800';
                paginationHtml += `<button onclick="changePage(${i})" class="px-3 py-1 border rounded-md ${activeClass} transition">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHtml += `<span class="px-2 py-1 text-gray-500">...</span>`;
                }
                paginationHtml += `<button onclick="changePage(${totalPages})" class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">${totalPages}</button>`;
            }

            // Next Button
            const nextDisabled = currentPage === totalPages ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : '';
            paginationHtml += `<button onclick="changePage(${currentPage + 1})" ${nextDisabled} class="px-3 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition">Next</button>`;

            controls.innerHTML = paginationHtml;
        }

        function changePage(page) {
            currentPage = page;
            renderRestaurants();
        }

        function editRestaurant(id) {
            const name = prompt("Enter new restaurant name:");
            if (name) {
                const r = restaurants.find(item => item.id === id);
                if (r) {
                    r.name = name;
                    renderRestaurants();
                }
            }
        }

        function deleteRestaurant(id) {
            if (!confirm("Are you sure you want to delete this restaurant?")) return;
            const index = restaurants.findIndex(item => item.id === id);
            if (index !== -1) {
                restaurants.splice(index, 1);
                filterRestaurants();
            }
        }

        function filterRestaurants() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cuisine = document.getElementById('cuisine-filter').value.toLowerCase();
            
            filteredRestaurants = restaurants.filter(r => {
                const matchesSearch = r.name.toLowerCase().includes(query) || r.location.toLowerCase().includes(query);
                const matchesCuisine = !cuisine || r.cuisine.toLowerCase().includes(cuisine);
                return matchesSearch && matchesCuisine;
            });
            
            currentPage = 1;
            renderRestaurants();
        }

        document.getElementById('search-input').addEventListener('input', filterRestaurants);
        document.getElementById('cuisine-filter').addEventListener('change', filterRestaurants);

        // Initial render
        renderRestaurants();
    </script>
</body>
</html>
